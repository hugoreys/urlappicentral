<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descarga iCentral App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f5;
      --text: #1a1a1a;
      --sub: #555;
      --card: #ffffff;
      --shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f12;
        --text: #f5f5f5;
        --sub: #a0a0a0;
        --card: #1c1c1e;
        --shadow: 0 12px 40px rgba(0,0,0,0.4);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .logo-wrap {
      display: inline-block;
      margin-bottom: 24px;
      background: #fff;
      border-radius: 22%;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      .logo-wrap { box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    }
    .logo {
      display: block;
      width: 120px;
      height: auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { margin-bottom: 28px; color: var(--sub); }
    .buttons { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      transition: transform 0.15s;
    }
    a:active { transform: scale(0.98); }
    .ios { background: #000; }
    @media (prefers-color-scheme: dark) {
      .ios { background: #fff; color: #000; }
    }
    .android { background: #3ddc84; color: #000; }
    .btn-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-content svg { flex-shrink: 0; height: 18px; width: auto; }
  </style>
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const iosUrl = 'https://apps.apple.com/us/app/icentral-app/id6792386283';
      const androidUrl = 'https://play.google.com/store/apps/details?id=mx.com.icentral.clientes';

      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.replace(iosUrl);
      } else if (/android/i.test(ua)) {
        window.location.replace(androidUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="logomark.jpg" alt="iCentral App" class="logo">
    </div>
    <h1>Descargando iCentral App</h1>
    <p>Detectando tu dispositivo...</p>
    <div class="buttons">
      <a class="ios" href="https://apps.apple.com/us/app/icentral-app/id6792386283">
        <span class="btn-content">
          <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true" focusable="false"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4.7 219.8 4.7 304.6 4.7 350.9 18.5 430 58 487.7 74.1 510.8 92.9 531.6 116.1 531.6c22.9 0 31.4-14.9 58.7-14.9 27.5 0 35.4 14.9 58.3 14.9 23.8 0 40.1-21.4 55.6-43.3 17.5-25.3 24.7-50 25.1-51.2-.5-.2-48.6-18.6-48.6-75.1 0-46.6 37.3-68.8 39.3-70.1-21.6-31.5-55.2-35.1-66.6-35.7-32.7-2.2-63.6 18.3-80.5 18.3-2.1 0-42.2-18.3-80.4-18.3-41.4 0-83.6 24.8-103.6 70.7-24.2 58.9-6.4 137.6 19.1 182.4 22.6 38.9 51.9 82.4 88.1 82.4 23.6 0 39.4-18.3 73.4-18.3 34.4 0 49.9 18.3 73.1 18.3 36.8 0 64.7-48.9 88.9-94.1 18.1-32.4 25.6-58.7 25.6-60.2zM241.6 97.3c0-31.6 18.9-59.3 45.6-73.7 4.8-2.6 9.3-4.3 12.8-5.4-13.1-8.5-29.3-13.6-46.6-13.6-31.7 0-59.2 20.2-70.5 50.3 13.7 3.6 27.8 5.5 42.1 5.5 6.9 0 13.7-.5 20.4-1.3-1.6 9.3-2.4 18.9-2.4 28.7 0 5.5.3 10.9.9 16.2z"/></svg>
          Descargar para iOS
        </span>
      </a>
      <a class="android" href="https://play.google.com/store/apps/details?id=mx.com.icentral.clientes">
        <span class="btn-content">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M5 3l14 9-14 9V3z"/></svg>
          Descargar para Android
        </span>
      </a>
    </div>
  </div>
</body>
</html>
