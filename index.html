<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descarga iCentral App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f5;
      --text: #1a1a1a;
      --sub: #555;
      --card: #ffffff;
      --shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f12;
        --text: #f5f5f5;
        --sub: #a0a0a0;
        --card: #1c1c1e;
        --shadow: 0 12px 40px rgba(0,0,0,0.4);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .logo-wrap {
      display: inline-block;
      margin-bottom: 24px;
      background: #fff;
      border-radius: 22%;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      .logo-wrap { box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    }
    .logo {
      display: block;
      width: 120px;
      height: auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { margin-bottom: 28px; color: var(--sub); }
    .buttons { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      transition: transform 0.15s;
    }
    a:active { transform: scale(0.98); }
    .ios { background: #000; }
    @media (prefers-color-scheme: dark) {
      .ios { background: #fff; color: #000; }
    }
    .android { background: #3ddc84; color: #000; }
    .btn-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-content svg { flex-shrink: 0; width: 18px; height: 18px; }
  </style>
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const iosUrl = 'https://apps.apple.com/us/app/icentral-app/id6792386283';
      const androidUrl = 'https://play.google.com/store/apps/details?id=mx.com.icentral.clientes';

      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.replace(iosUrl);
      } else if (/android/i.test(ua)) {
        window.location.replace(androidUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="logomark.jpg" alt="iCentral App" class="logo">
    </div>
    <h1>Descargando iCentral App</h1>
    <p>Detectando tu dispositivo...</p>
    <div class="buttons">
      <a class="ios" href="https://apps.apple.com/us/app/icentral-app/id6792386283">
        <span class="btn-content">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53-1.71-2.52-3-7.14-1.25-10.27 1.25-2.19 3.47-3.56 5.87-3.59 1.39-.03 2.66.92 3.5.92.84 0 2.39-1.17 4.04-1 .34.01 2.03.19 2.99 1.4-.07.05-1.78 1.05-1.76 3.13 0 2.47 2.14 3.3 2.21 3.34-.03.1-.34 1.16-1.02 2.29-.69 1.12-1.42 2.24-2.01 2.24-.5 0-.86-.32-1.72-.32-.85 0-1.55.34-2.09.71-.5.34-.95.59-1.5.59-.57 0-1.02-.25-1.68-1.03zM12.97 4.95c1.24-1.55 2.11-3.72 1.86-5.89-1.79.07-3.96 1.2-5.24 2.75-1.15 1.37-2.16 3.58-1.89 5.65 2.04.16 4.1-1.07 5.27-2.51z"/></svg>
          Descargar para iOS
        </span>
      </a>
      <a class="android" href="https://play.google.com/store/apps/details?id=mx.com.icentral.clientes">
        <span class="btn-content">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M5 3l14 9-14 9V3z"/></svg>
          Descargar para Android
        </span>
      </a>
    </div>
  </div>
</body>
</html>
