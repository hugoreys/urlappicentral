<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descarga iCentral App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f5;
      --text: #1a1a1a;
      --sub: #555;
      --card: #ffffff;
      --shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f12;
        --text: #f5f5f5;
        --sub: #a0a0a0;
        --card: #1c1c1e;
        --shadow: 0 12px 40px rgba(0,0,0,0.4);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .logo-wrap {
      display: inline-block;
      margin-bottom: 24px;
      background: #fff;
      border-radius: 22%;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    @media (prefers-color-scheme: dark) {
      .logo-wrap { box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    }
    .logo {
      display: block;
      width: 120px;
      height: auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { margin-bottom: 28px; color: var(--sub); }
    .buttons { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      transition: transform 0.15s;
    }
    a:active { transform: scale(0.98); }
    .ios { background: #000; }
    @media (prefers-color-scheme: dark) {
      .ios { background: #fff; color: #000; }
    }
    .android { background: #3ddc84; color: #000; }
  </style>
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const iosUrl = 'https://apps.apple.com/us/app/icentral-app/id6792386283';
      const androidUrl = 'https://play.google.com/store/apps/details?id=mx.com.icentral.clientes';

      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.replace(iosUrl);
      } else if (/android/i.test(ua)) {
        window.location.replace(androidUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="logomark.jpg" alt="iCentral App" class="logo">
    </div>
    <h1>Descargando iCentral App</h1>
    <p>Detectando tu dispositivo...</p>
    <div class="buttons">
      <a class="ios" href="https://apps.apple.com/us/app/icentral-app/id6792386283">Descargar para iOS</a>
      <a class="android" href="https://play.google.com/store/apps/details?id=mx.com.icentral.clientes">Descargar para Android</a>
    </div>
  </div>
</body>
</html>
